services:
  - type: web
    name: catatkod-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: catatkod-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

databases:
  - name: catatkod-db
    databaseName: catatkod
    user: catatkod
